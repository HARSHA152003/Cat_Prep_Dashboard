<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Discipline — CAT Prep Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h2>Not configured yet</h2>
    <p>Set <code>CONFIG.API_URL</code> in <code>script.js</code> to your deployed Google Apps Script Web App URL (ending in <code>/exec</code>), then reload this page.</p>
  </div>
</div>

<div id="appShell">
  <div class="app-flex">
    <aside id="sidebar">
      <div class="brand">
        <div class="mark">CP</div>
        <div>
          <div class="name">CAT Prep Tracker</div>
          <div class="sub">LIVE SHEET SYNC</div>
        </div>
      </div>
      <nav id="navlist"></nav>
      <div class="sidebar-foot">
        <div class="sync-row"><span class="dot" id="liveDot"></span><span id="syncStatus">Not synced yet</span></div>
      </div>
    </aside>

    <div id="backdrop"></div>

    <div class="main">
      <div class="topbar">
        <button id="menuBtn" aria-label="Toggle menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="titles">
          <h1 id="pageTitle">Daily Discipline</h1>
          <div class="sub" id="pageSub">HABIT CALENDAR</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
        </div>
      </div>
      <div id="content"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="script.js"></script>
<script>
let disciplineCalState = { year: new Date().getFullYear(), month: new Date().getMonth(), selectedDate: todayISO() };

// Daily Discipline is a read-only overview, computed entirely from the other logs
// (Test_And_Targets_Log, Concept_Study_Log, Reading_And_Vocab) plus the external
// mock tracker — there is nothing here for the user to edit.
function buildDayBreakdown(dateStr){
  const items = [];
  const testsForDay = DATA.tests.filter(t=>t.date===dateStr);
  const crackuByArea = {};
  testsForDay.filter(t=>t.sourceLabel==='Cracku').forEach(t=>{ crackuByArea[t.area] = (crackuByArea[t.area]||0) + Number(t.duration||0); });
  ['VARC','DILR','Quant'].forEach(area=>{ if(crackuByArea[area]) items.push({ label:`Cracku – ${area}`, minutes: crackuByArea[area] }); });

  const advMins = testsForDay.filter(t=>t.sourceLabel==='2IIM Advanced').reduce((s,t)=>s+Number(t.duration||0),0);
  if(advMins) items.push({ label:'2IIM – Advanced', minutes: advMins });

  const secMins = testsForDay.filter(t=>t.sourceLabel==='2IIM Sectional').reduce((s,t)=>s+Number(t.duration||0),0);
  if(secMins) items.push({ label:'2IIM – Sectional Test', minutes: secMins });

  const mockRec = findMockForDate(dateStr);
  if(mockRec){
    // Mocks are always fixed-length — 2 hours, regardless of what the external tracker reports.
    const mockMinutes = 120;
    const note = `Mock #${mockRec.mockNo ?? '—'}${mockRec.mockName ? ' "'+mockRec.mockName+'"' : ''}${mockRec.overall_score!=null ? ' — '+mockRec.overall_score+' pts' : ''}${mockRec.overall_accuracy!=null ? ', '+mockRec.overall_accuracy+' acc.' : ''}`;
    items.push({ label:'Mock', minutes: mockMinutes, note });
  }

  const studyMins = DATA.study.filter(s=>s.date===dateStr).reduce((s,r)=>s+Number(r.hours||0)*60,0);
  if(studyMins) items.push({ label:'Study', minutes: Math.round(studyMins) });

  const readingMins = DATA.reading.filter(r=>r.date===dateStr).reduce((s,r)=>s+Number(r.minutes||0),0);
  if(readingMins) items.push({ label:'Leisure Reading', minutes: readingMins });

  const total = items.reduce((s,it)=>s+Number(it.minutes||0),0);
  return { items, total };
}
function renderDisciplineDayKpis(dateStr){
  const { total, items } = buildDayBreakdown(dateStr);
  const mockTaken = items.some(it=>it.label==='Mock') ? 1 : 0;
  return `
    <div class="kpi"><div class="label">Total time logged — ${fmtDate(dateStr)}</div><div class="value">${round1(total/60)}<span class="unit">hrs</span></div></div>
    <div class="kpi"><div class="label">Mocks taken — ${fmtDate(dateStr)}</div><div class="value">${mockTaken}</div></div>`;
}
function renderDisciplineOverview(dateStr){
  const { items, total } = buildDayBreakdown(dateStr);
  if(!items.length){
    return `<div class="hint">No activity logged for this date yet.</div>`;
  }
  const rows = items.map(it=>`
    <tr>
      <td>${it.label}${it.note ? `<div class="hint" style="margin-top:2px;">${escapeHtml(it.note)}</div>` : ''}</td>
      <td class="num">${it.minutes}m</td>
    </tr>`).join('');
  return `
    <div class="table-scroll"><table><thead><tr><th>Activity</th><th>Time spent</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="calc-box" style="margin-top:14px;">
      <div class="calc-item"><div class="l">Total time</div><div class="v">${total}m<span style="font-size:11px;color:var(--faint);font-weight:400;margin-left:6px;">(${Math.round((total/60)*10)/10}h)</span></div></div>
    </div>`;
}
function renderDisciplineCalendar(){
  const {year, month, selectedDate} = disciplineCalState;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-IN',{month:'long', year:'numeric'});
  const extMockDates = mockDatesSet();

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const hasMock = extMockDates.has(dateStr);
    const hasActivity = buildDayBreakdown(dateStr).items.length > 0;
    let cls = 'cal-cell';
    if(hasActivity) cls += ' cal-done';
    if(dateStr === selectedDate) cls += ' cal-selected';
    if(dateStr === todayISO()) cls += ' cal-today';
    cells += `<button type="button" class="${cls}" data-date="${dateStr}">
      <span>${day}</span>
      ${hasMock ? '<span class="cal-mock-dot" title="Mock taken"></span>' : ''}
    </button>`;
  }
  return `
    <div class="cal-head">
      <button type="button" class="btn btn-ghost btn-sm" id="calPrev">‹</button>
      <div class="cal-title">${monthLabel}</div>
      <button type="button" class="btn btn-ghost btn-sm" id="calNext">›</button>
    </div>
    <div class="cal-grid cal-weekday-row">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-weekday">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><i class="dot done"></i> Activity logged</span>
      <span><i class="dot mock"></i> Mock taken</span>
    </div>`;
}
function wireDisciplineCalendar(){
  const cal = document.getElementById('disciplineCalendar');
  if(!cal) return;
  cal.querySelectorAll('[data-date]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      disciplineCalState.selectedDate = btn.dataset.date;
      const label = document.getElementById('dc_selectedDateLabel');
      if(label) label.textContent = fmtDate(btn.dataset.date);
      cal.innerHTML = renderDisciplineCalendar();
      wireDisciplineCalendar();
      const overview = document.getElementById('disciplineOverview');
      if(overview) overview.innerHTML = renderDisciplineOverview(btn.dataset.date);
      const dayKpis = document.getElementById('disciplineDayKpis');
      if(dayKpis) dayKpis.innerHTML = renderDisciplineDayKpis(btn.dataset.date);
    });
  });
  document.getElementById('calPrev')?.addEventListener('click', ()=>{
    disciplineCalState.month--; if(disciplineCalState.month<0){disciplineCalState.month=11; disciplineCalState.year--;}
    cal.innerHTML = renderDisciplineCalendar(); wireDisciplineCalendar();
  });
  document.getElementById('calNext')?.addEventListener('click', ()=>{
    disciplineCalState.month++; if(disciplineCalState.month>11){disciplineCalState.month=0; disciplineCalState.year++;}
    cal.innerHTML = renderDisciplineCalendar(); wireDisciplineCalendar();
  });
}

function renderPage(){
  const activeDates = new Set([...DATA.tests.map(t=>t.date), ...DATA.study.map(s=>s.date), ...DATA.reading.map(r=>r.date)]);
  let banner = '';
  if(syncError) banner = `<div class="err-banner"><span>Last sync failed: ${escapeHtml(syncError)}. Showing most recent data.</span><button onclick="refreshAll(true)">Retry</button></div>`;

  document.getElementById('content').innerHTML = banner + `
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;" id="disciplineKpis">
      <div class="kpi"><div class="label">Days with activity logged</div><div class="value">${activeDates.size}</div></div>
      <div id="disciplineDayKpis" style="display:contents;">${renderDisciplineDayKpis(disciplineCalState.selectedDate)}</div>
    </div>
    <div class="grid2" style="align-items:start;">
      <div class="card">
        <div class="card-h"><h3>Pick a date</h3><span class="tag">CALENDAR</span></div>
        <div id="disciplineCalendar">${renderDisciplineCalendar()}</div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Overview for <span id="dc_selectedDateLabel">${fmtDate(disciplineCalState.selectedDate)}</span></h3><span class="tag">READ-ONLY</span></div>
        <div id="disciplineOverview">${renderDisciplineOverview(disciplineCalState.selectedDate)}</div>
      </div>
    </div>`;
  wireDisciplineCalendar();
}
window.renderPage = renderPage;

document.addEventListener('DOMContentLoaded', ()=>{ bootPage(); });
</script>
</body>
</html>
